name: Feature request
description: 建议新增能力或改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前工作流哪里受阻？不要先写实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 结构化意图 / API / 配置层面需要什么？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否可以用现有 actions.run / 自定义 taskType 解决？

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 方案不接受任意 JS / CSS selector / 坐标执行
          required: true
        - label: 涉及外部服务时说明如何离线测试或 skip
          required: true
