<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>显式等待 · Spike 本地靶场</title>
    <style>
      body { font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 40px; color: #1f2430; background: #f4f6fa; }
      main { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #d9dee8; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 16px; font-size: 18px; }
      [role="progressbar"] { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: #eef2ff; color: #3b5bdb; font-size: 13px; font-weight: 600; }
      [role="progressbar"][hidden] { display: none; }
      button { margin-top: 16px; padding: 9px 18px; border: 0; border-radius: 8px; background: #3b5bdb; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
      [role="status"] { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #1f7a4d; background: #e7f5ee; }
      [role="status"][hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>显式等待</h1>
      <div id="spinner" role="progressbar" aria-label="加载中">加载中…</div>
      <button type="button" id="sync">触发同步</button>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </main>
    <script>
      const spinner = document.getElementById('spinner');
      const status = document.getElementById('status');
      const button = document.getElementById('sync');

      // 首屏模拟一个 1200ms 后消失的加载态，用于 waitForHidden。
      setTimeout(() => {
        spinner.hidden = true;
      }, 1200);

      button.addEventListener('click', async () => {
        spinner.hidden = false;
        status.hidden = true;
        const started = Date.now();
        const response = await fetch('/api/slow?ms=600');
        const body = await response.json();
        spinner.hidden = true;
        status.hidden = false;
        status.textContent = '同步完成（' + (Date.now() - started) + 'ms, delayed=' + body.delayedMs + 'ms）';
      });
    </script>
  </body>
</html>
