<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Radix 自定义下拉 · Spike 本地靶场</title>
    <style>
      body { font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 40px; color: #1f2430; background: #f4f6fa; }
      main { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #d9dee8; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 16px; font-size: 18px; }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      [role="combobox"] { width: 100%; text-align: left; padding: 10px 12px; border: 1px solid #d9dee8; border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
      [role="combobox"][aria-expanded="true"] { border-color: #3b5bdb; }
      [role="listbox"] { list-style: none; margin: 6px 0 0; padding: 6px; border: 1px solid #d9dee8; border-radius: 8px; background: #fff; }
      [role="listbox"][hidden] { display: none; }
      [role="option"] { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
      [role="option"]:hover, [role="option"][aria-selected="true"] { background: #eef2ff; }
      [role="status"] { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #1f7a4d; background: #e7f5ee; }
      [role="status"][hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Radix 风格自定义下拉</h1>
      <label id="category-label" for="category-trigger">商品分类</label>
      <button
        type="button"
        id="category-trigger"
        role="combobox"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-labelledby="category-label"
      >
        请选择分类
      </button>
      <ul role="listbox" aria-labelledby="category-label" hidden>
        <li role="option" data-value="digital" tabindex="0">数码</li>
        <li role="option" data-value="appliance" tabindex="0">家电</li>
        <li role="option" data-value="clothing" tabindex="0">服饰</li>
      </ul>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </main>
    <script>
      const trigger = document.getElementById('category-trigger');
      const listbox = document.querySelector('[role="listbox"]');
      const status = document.getElementById('status');

      trigger.addEventListener('click', () => {
        const open = listbox.hidden;
        listbox.hidden = !open;
        trigger.setAttribute('aria-expanded', String(open));
      });

      for (const option of listbox.querySelectorAll('[role="option"]')) {
        option.addEventListener('click', () => {
          for (const item of listbox.querySelectorAll('[role="option"]')) {
            item.setAttribute('aria-selected', 'false');
          }
          option.setAttribute('aria-selected', 'true');
          trigger.textContent = option.textContent.trim();
          listbox.hidden = true;
          trigger.setAttribute('aria-expanded', 'false');
          status.hidden = false;
          status.textContent = '已选择：' + option.textContent.trim();
        });
      }
    </script>
  </body>
</html>
