<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>iframe 宿主页 · Spike 本地靶场</title>
    <style>
      body { font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 40px; color: #1f2430; background: #f4f6fa; }
      main { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid #d9dee8; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { font-size: 13px; color: #6b7280; }
      iframe { width: 100%; height: 320px; border: 1px solid #d9dee8; border-radius: 10px; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>iframe 宿主页</h1>
      <p>表单在 name=checkout / title=结算表单 的 iframe 内，用来验证 frameLocator 与作用域唯一性。</p>
      <iframe name="checkout" title="结算表单" src="/iframe-inner"></iframe>
    </main>
  </body>
</html>
