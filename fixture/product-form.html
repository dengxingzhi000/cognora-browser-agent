<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新建商品 · Spike 本地靶场</title>
    <style>
      :root {
        --ink: #1f2430;
        --muted: #6b7280;
        --line: #d9dee8;
        --bg: #f4f6fa;
        --card: #ffffff;
        --accent: #3b5bdb;
        --ok: #1f7a4d;
        --ok-bg: #e7f5ee;
        --warn: #a33a2b;
        --warn-bg: #fdeceb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 32px 20px 56px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      }

      main { max-width: 820px; margin: 0 auto; }

      header { margin-bottom: 20px; }

      h1 { margin: 0 0 6px; font-size: 24px; }

      .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

      .auth-state {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }

      .auth-state.ok { color: var(--ok); background: var(--ok-bg); }
      .auth-state.warn { color: var(--warn); background: var(--warn-bg); }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px 24px;
        margin-bottom: 18px;
      }

      .card h2 { margin: 0 0 16px; font-size: 15px; }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 20px;
      }

      .field { display: flex; flex-direction: column; gap: 6px; }
      .field.full { grid-column: 1 / -1; }

      label { font-size: 13px; font-weight: 600; }

      input, select, textarea {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 91, 219, 0.15);
      }

      textarea { resize: vertical; }

      .actions { display: flex; gap: 12px; margin-top: 22px; }

      button {
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      #save-draft { background: #fff; border-color: var(--line); color: var(--ink); }
      #publish { background: var(--accent); color: #fff; }

      [role="status"] {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      [role="status"][data-kind="success"] { color: var(--ok); background: var(--ok-bg); }
      [role="status"][data-kind="error"] { color: var(--warn); background: var(--warn-bg); }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }

      th, td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      th { color: var(--muted); font-weight: 600; }

      .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>新建商品</h1>
        <p class="subtitle">browser-agent-spike 本地靶场：字段语义与真实商品表单一致，后端为内存模拟。</p>
        <span id="auth-state" class="auth-state warn">登录态检测中…</span>
      </header>

      <form id="product-form" class="card" novalidate>
        <h2>基本信息</h2>
        <div class="grid">
          <div class="field">
            <label for="name">商品名称</label>
            <input id="name" name="name" type="text" autocomplete="off" placeholder="例如：iPhone 15 Pro" />
          </div>

          <div class="field">
            <label for="brand">品牌</label>
            <select id="brand" name="brand">
              <option value="">请选择品牌</option>
              <option value="apple">苹果</option>
              <option value="samsung">三星</option>
              <option value="huawei">华为</option>
            </select>
          </div>

          <div class="field">
            <label for="price">价格</label>
            <input id="price" name="price" type="text" inputmode="decimal" placeholder="0.00" />
          </div>

          <div class="field">
            <label for="stock">库存</label>
            <input id="stock" name="stock" type="text" inputmode="numeric" placeholder="0" />
          </div>

          <div class="field full">
            <label for="description">描述</label>
            <textarea id="description" name="description" rows="4" placeholder="可选"></textarea>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="save-draft">保存草稿</button>
          <button type="button" id="publish">提交发布</button>
        </div>

        <div id="status" role="status" aria-live="polite" hidden></div>
        <p class="hint">「提交发布」是最终提交类动作，执行层默认拦截；「保存草稿」允许执行。</p>
      </form>

      <section class="card">
        <h2>最近草稿</h2>
        <table aria-label="最近草稿">
          <thead>
            <tr>
              <th>商品名称</th>
              <th>品牌</th>
              <th>价格</th>
              <th>库存</th>
            </tr>
          </thead>
          <tbody id="draft-rows"></tbody>
        </table>
      </section>
    </main>

    <script>
      const authState = document.getElementById('auth-state');
      const hasToken = document.cookie
        .split('; ')
        .some((item) => item.startsWith('access_token='));

      authState.textContent = hasToken ? '登录态：access_token 已携带' : '登录态：缺少 access_token';
      authState.className = `auth-state ${hasToken ? 'ok' : 'warn'}`;

      const status = document.getElementById('status');
      const rows = document.getElementById('draft-rows');
      const brandLabels = { apple: '苹果', samsung: '三星', huawei: '华为' };

      function setStatus(text, kind) {
        status.hidden = false;
        status.textContent = text;
        status.dataset.kind = kind;
      }

      function readForm() {
        return {
          name: document.getElementById('name').value,
          brand: document.getElementById('brand').value,
          price: document.getElementById('price').value,
          stock: document.getElementById('stock').value,
          description: document.getElementById('description').value,
        };
      }

      function addRow(draft) {
        const row = document.createElement('tr');
        for (const value of [
          draft.name,
          brandLabels[draft.brand] || draft.brand || '-',
          draft.price,
          draft.stock,
        ]) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.appendChild(cell);
        }
        rows.appendChild(row);
      }

      document.getElementById('product-form').addEventListener('submit', (event) => {
        event.preventDefault();
      });

      document.getElementById('save-draft').addEventListener('click', async () => {
        const payload = readForm();
        if (!payload.name) {
          setStatus('请先填写商品名称', 'error');
          return;
        }

        const response = await fetch('/api/drafts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const body = await response.json();

        if (!response.ok || !body.ok) {
          setStatus(`保存失败：${body.error || response.status}`, 'error');
          return;
        }

        setStatus('草稿已保存', 'success');
        addRow(body.draft);
      });

      document.getElementById('publish').addEventListener('click', () => {
        setStatus('已提交发布', 'success');
      });
    </script>
  </body>
</html>
