<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>文件上传 · Spike 本地靶场</title>
    <style>
      body { font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 40px; color: #1f2430; background: #f4f6fa; }
      main { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #d9dee8; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 16px; font-size: 18px; }
      label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      input[type="file"] { display: block; width: 100%; padding: 9px; border: 1px dashed #b9c2d4; border-radius: 8px; background: #fafbfe; font: inherit; font-size: 13px; }
      button { margin-top: 14px; padding: 9px 18px; border: 0; border-radius: 8px; background: #3b5bdb; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
      [role="status"] { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #1f7a4d; background: #e7f5ee; }
      [role="status"][hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>文件上传</h1>
      <label for="receipt">选择文件</label>
      <input id="receipt" name="receipt" type="file" />
      <button type="button" id="parse">解析文件</button>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </main>
    <script>
      document.getElementById('parse').addEventListener('click', () => {
        const input = document.getElementById('receipt');
        const files = Array.from(input.files || []);
        const status = document.getElementById('status');
        status.hidden = false;
        if (files.length === 0) {
          status.textContent = '请先选择文件';
          return;
        }
        status.textContent =
          '已接收 ' + files.map((file) => file.name + '（' + file.size + ' 字节）').join('，');
      });
    </script>
  </body>
</html>
