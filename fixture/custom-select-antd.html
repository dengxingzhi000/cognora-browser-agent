<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>AntD 自定义下拉 · Spike 本地靶场</title>
    <style>
      body { font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 40px; color: #1f2430; background: #f4f6fa; }
      main { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #d9dee8; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 16px; font-size: 18px; }
      .ant-select-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
      .ant-select { position: relative; width: 100%; }
      .ant-select-selector { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid #d9dee8; border-radius: 8px; background: #fff; cursor: pointer; }
      .ant-select-focused .ant-select-selector { border-color: #3b5bdb; }
      .ant-select-selection-placeholder { color: #8a93a5; font-size: 14px; }
      .ant-select-selection-item { font-size: 14px; }
      .ant-select-selection-item[hidden], .ant-select-selection-placeholder[hidden] { display: none; }
      .ant-select-selection-search-input { flex: 1; min-width: 40px; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; }
      .ant-select-dropdown { position: absolute; z-index: 10; width: 100%; margin-top: 6px; padding: 6px; border: 1px solid #d9dee8; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(31, 36, 48, 0.12); }
      .ant-select-dropdown-hidden { display: none; }
      .ant-select-item-option { padding: 8px 10px; border-radius: 6px; font-size: 14px; cursor: pointer; }
      .ant-select-item-option:hover, .ant-select-item-option-active { background: #eef2ff; }
      [role="status"] { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #1f7a4d; background: #e7f5ee; }
      [role="status"][hidden] { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>AntD 风格自定义下拉</h1>
      <label class="ant-select-label" id="cat-label" for="cat-input">商品分类</label>
      <div class="ant-select" id="cat-select">
        <div class="ant-select-selector">
          <span class="ant-select-selection-placeholder">请选择分类</span>
          <span class="ant-select-selection-item" id="cat-selected" hidden></span>
          <input
            id="cat-input"
            class="ant-select-selection-search-input"
            role="combobox"
            aria-labelledby="cat-label"
            aria-expanded="false"
            readonly
          />
        </div>
      </div>
      <div class="ant-select-dropdown ant-select-dropdown-hidden" id="cat-dropdown">
        <div class="ant-select-item-option" data-value="digital">
          <div class="ant-select-item-option-content">数码</div>
        </div>
        <div class="ant-select-item-option" data-value="appliance">
          <div class="ant-select-item-option-content">家电</div>
        </div>
        <div class="ant-select-item-option" data-value="clothing">
          <div class="ant-select-item-option-content">服饰</div>
        </div>
      </div>
      <div id="status" role="status" aria-live="polite" hidden></div>
    </main>
    <script>
      const select = document.getElementById('cat-select');
      const input = document.getElementById('cat-input');
      const dropdown = document.getElementById('cat-dropdown');
      const placeholder = document.querySelector('.ant-select-selection-placeholder');
      const selected = document.getElementById('cat-selected');
      const status = document.getElementById('status');

      function open() {
        dropdown.classList.remove('ant-select-dropdown-hidden');
        select.classList.add('ant-select-focused');
        input.setAttribute('aria-expanded', 'true');
      }

      function close() {
        dropdown.classList.add('ant-select-dropdown-hidden');
        select.classList.remove('ant-select-focused');
        input.setAttribute('aria-expanded', 'false');
      }

      input.addEventListener('click', open);
      select.querySelector('.ant-select-selector').addEventListener('click', open);

      for (const option of dropdown.querySelectorAll('.ant-select-item-option')) {
        option.addEventListener('click', () => {
          for (const item of dropdown.querySelectorAll('.ant-select-item-option')) {
            item.classList.remove('ant-select-item-option-active');
          }
          option.classList.add('ant-select-item-option-active');
          placeholder.hidden = true;
          selected.hidden = false;
          selected.textContent = option.textContent.trim();
          close();
          status.hidden = false;
          status.textContent = '已选择：' + option.textContent.trim();
        });
      }
    </script>
  </body>
</html>
