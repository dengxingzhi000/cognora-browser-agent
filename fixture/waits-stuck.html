<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>不会消失的 spinner · Spike 本地靶场</title>
    <style>
      body { font-family: "Microsoft YaHei", system-ui, sans-serif; padding: 40px; color: #1f2430; background: #f4f6fa; }
      main { max-width: 560px; margin: 0 auto; background: #fff; border: 1px solid #d9dee8; border-radius: 12px; padding: 24px; }
      h1 { margin: 0 0 16px; font-size: 18px; }
      [role="progressbar"] { display: inline-flex; padding: 8px 12px; border-radius: 8px; background: #eef2ff; color: #3b5bdb; font-size: 13px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>不会消失的 spinner</h1>
      <div id="spinner" role="progressbar" aria-label="加载中">加载中…</div>
      <p>用于验证 waitForHidden 超时会给出可读原因。</p>
    </main>
  </body>
</html>
